<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101215">
  <meta name="description" content="Görselinin arka planını tarayıcıda kaldır ve şeffaf PNG olarak indir.">
  <title>üğdül istedi ben yaptım — Görsel arka planını kaldır</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="frame" viewBox="0 0 24 24"><path d="M9 3H6a3 3 0 0 0-3 3v3m12-6h3a3 3 0 0 1 3 3v3m0 6v3a3 3 0 0 1-3 3h-3m-6 0H6a3 3 0 0 1-3-3v-3"/><path d="m8 14 3-3 3 3 2-2 2 2M14 8h.01"/></symbol>
    <symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="split" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-4-4h.01"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  </svg>
  <header class="top"><div class="top-inner">
    <a class="brand" href="./" aria-label="üğdül istedi ben yaptım ana sayfa"><span><svg><use href="#frame"/></svg></span>üğdül istedi ben yaptım</a>
    <span class="private"><svg><use href="#lock"/></svg> Tarayıcıda çalışır</span>
  </div></header>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="copy">
        <h1 id="title">Arka planı <em>sil.</em></h1>
        <p class="intro">Görselini bırak, arka planı otomatik kaldıralım.<br class="desktop"> Sonucu şeffaf PNG olarak indir.</p>
        <div class="drop" id="drop">
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <button class="primary" id="select" type="button"><svg><use href="#upload"/></svg> Görsel seç</button>
          <p>veya buraya sürükle ve bırak</p>
          <small>JPG, PNG, WebP · En fazla 25 MB</small>
        </div>
        <div class="status" id="status" role="status" aria-live="polite" hidden>
          <span class="spinner" id="spinner" hidden></span><span id="message"></span>
        </div>
        <button type="button" class="primary download" id="download" hidden><svg><use href="#download-icon"/></svg> Şeffaf PNG indir</button>
        <button type="button" id="demo" class="text-button">Örnek görseli dene <svg><use href="#arrow"/></svg></button>
      </div>
      <figure class="preview">
        <div class="stage" id="stage">
          <div class="layer before"><img id="before" alt="Orijinal görsel"></div>
          <div class="layer after"><img id="after" alt="Arka planı kaldırılmış görsel"></div>
          <span class="tag tag-left">Önce</span><span class="tag tag-right">Sonra</span>
          <div class="divider" aria-hidden="true"><span><svg><use href="#split"/></svg></span></div>
          <input type="range" id="compare" min="0" max="100" value="50" aria-label="Önce ve sonra karşılaştırma konumu">
        </div>
        <figcaption id="caption">Karşılaştırmak için çizgiyi sürükle</figcaption>
      </figure>
    </section>
  </main>
  <footer><span>Görseller cihazında işlenir.</span><a href="./model-notice.txt">Model bilgisi</a></footer>
</body>
</html>
